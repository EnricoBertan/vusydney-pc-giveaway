        return modules;

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }
      if (_dataCache == null) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }

      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;

    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);

    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {

          var col = pos[j];
          if (_modules[row][col] != null) {

            for (var c = -2; c <= 2; c += 1) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      for (var i = 0; i < 18; i += 1) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;

      // horizontal

        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;

          _modules[8][15 - i - 1 + 1] = mod;

      var row = _moduleCount - 1;
      var bitIndex = 7;

        for (var r = 0; r < rsBlocks.length; r += 1) {

            index += 1;

        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = ecdata[r][i];
            index += 1;
          }

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }
      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }
      // padding

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };

      mode = mode || 'Byte';
      var newData = null;
      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;

        throw 'mode:' + mode;
      }

      _dataCache = null;
    };

      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

            break;

        qrHtml += '<tr>';

          qrHtml += ' border-width: 0px; border-style: none;';

          qrHtml += ' padding: 0px; margin: 0px;';

      img += '\u0020width="';

      img += '"';
      img += '\u0020height="';

      img += '"';

      var escaped = '';

      var min = margin;
      var max = size - margin;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

            p += '█';

    _this.createASCII = function(cellSize, margin) {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;
      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;
      var y, x, r, p;
      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');
      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

    // create conversion map.
    var unicodeMap = function() {
      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };
      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }
      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

    background-size: 13px 13px;
    opacity:0.05;

  var firebaseConfig = {
    apiKey: "AIzaSyDPPu57zov40-BBcn82UCNjnWAAt7WMkoM",
    authDomain: "vusydney-pc-giveaway.firebaseapp.com",
    databaseURL: "https://vusydney-pc-giveaway-default-rtdb.firebaseio.com",
    projectId: "vusydney-pc-giveaway",
    storageBucket: "vusydney-pc-giveaway.firebasestorage.app",
    messagingSenderId: "1051903925817",
    appId: "1:1051903925817:web:c09770a0a2629b9b8db7e8",
    measurementId: "G-T586SME2XZ"
  };
  // =============================
  document.getElementById('logoImg').src = LOGO_BASE64;

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var counterRef = db.ref('counter');

  var latestData = { remaining: TOTAL_SCREENS, total: TOTAL_SCREENS, updatedAt: Date.now() };
  var lastRemaining = null;
  var unlocked = false;
  var countEl = document.getElementById('countEl');
  var totalEl = document.getElementById('totalEl');
  var barFill = document.getElementById('barFill');
  var barCaption = document.getElementById('barCaption');
  var doneBanner = document.getElementById('doneBanner');

  function render(data){
    if(!data) return;
    latestData = data;
    var remaining = Math.max(0, Math.min(data.total, data.remaining));
    totalEl.textContent = data.total;
    document.getElementById('adminTotalDisplay').textContent = data.total;
    if(lastRemaining !== null && lastRemaining !== remaining){
      countEl.classList.add('pulse');
      setTimeout(function(){ countEl.classList.remove('pulse'); }, 260);
    }
    lastRemaining = remaining;
    countEl.textContent = remaining;
    document.getElementById('adminCountDisplay').textContent = remaining;
    var claimedPct = data.total > 0 ? ((data.total - remaining) / data.total) * 100 : 0;
    barFill.style.width = (100 - claimedPct) + "%";
    var claimed = data.total - remaining;
    barCaption.textContent = claimed + " claimed so far";
    if(remaining <= 0){
      doneBanner.classList.add('show');
    } else {
      doneBanner.classList.remove('show');
    }
  }

  // Render immediately with the default full count so the page never sits
  // blank while Firebase connects, then upgrade to the live shared value.
  render(latestData);

  // Realtime listener — pushes updates to every open device instantly,
  // no polling needed. This fires once right away with whatever is
  // currently stored (or null if nobody has written yet).
  counterRef.on('value', function(snapshot){
    var data = snapshot.val();
    if(data){
      render(data);
    } else {
      // Nobody has initialized the counter yet — seed it with the full count.
      counterRef.set({ remaining: TOTAL_SCREENS, total: TOTAL_SCREENS, updatedAt: Date.now() });
    }
  }, function(err){
    flashSaveNote("Can't reach the live count right now.");
  });

  function writeCount(newRemaining){
    var clamped = Math.max(0, Math.min(latestData.total, newRemaining));
    var updated = { remaining: clamped, total: latestData.total, updatedAt: Date.now() };
    counterRef.set(updated)
      .then(function(){ flashSaveNote(); })
      .catch(function(){ flashSaveNote("Couldn't save — check your connection."); });
  }

  function flashSaveNote(msg){
    var n = document.getElementById('saveNote');
    var text = msg === undefined ? "Saved" : msg;
    n.textContent = text;
    setTimeout(function(){ n.textContent = ""; }, text === "Saved" ? 1200 : 2600);
  }

  // ---- staff / PIN flow ----
  var pinOverlay = document.getElementById('pinOverlay');
  var adminOverlay = document.getElementById('adminOverlay');
  var pinInput = document.getElementById('pinInput');
  var pinError = document.getElementById('pinError');
  document.getElementById('staffOpenBtn').addEventListener('click', function(){
    pinInput.value = "";
    pinError.textContent = "";
    pinOverlay.classList.add('show');
    setTimeout(function(){ pinInput.focus(); }, 50);
  });
  document.getElementById('pinCancel').addEventListener('click', function(){
    pinOverlay.classList.remove('show');
  });
  document.getElementById('pinSubmit').addEventListener('click', submitPin);
  pinInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitPin();
  });
  async function sha256Hex(text){
    var enc = new TextEncoder().encode(text);
    var hashBuffer = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hashBuffer)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
  }
  async function submitPin(){
    var enteredHash = await sha256Hex(pinInput.value);
    if(enteredHash === STAFF_PIN_HASH){
      unlocked = true;
      pinOverlay.classList.remove('show');
      openAdmin();
    } else {
      pinError.textContent = "Wrong PIN, try again.";
    }
  }
  function openAdmin(){
    render(latestData);
    adminOverlay.classList.add('show');
    buildQr();
  }
  document.getElementById('adminCloseBtn').addEventListener('click', function(){
    adminOverlay.classList.remove('show');
  });
  document.getElementById('minusBtn').addEventListener('click', function(){
    writeCount(latestData.remaining - 1);
  });
  document.getElementById('plusBtn').addEventListener('click', function(){
    writeCount(latestData.remaining + 1);
  });
  document.getElementById('setBtn').addEventListener('click', function(){
    var val = parseInt(document.getElementById('setInput').value, 10);
    if(!isNaN(val)){
      writeCount(val);
      document.getElementById('setInput').value = "";
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    var updated = { remaining: TOTAL_SCREENS, total: TOTAL_SCREENS, updatedAt: Date.now() };
    counterRef.set(updated)
      .then(function(){ flashSaveNote(); })
      .catch(function(){ flashSaveNote("Couldn't save — check your connection."); });
  });
  function looksLikeRealPublicUrl(url){
    // A real published link is a normal, short https:// address.
    if(!url) return false;
    if(!/^https?:\/\//i.test(url)) return false;
    if(url.length > 300) return false;
    return true;
  }
  function generateQr(url){
    var box = document.getElementById('qrcode');
    var hint = document.getElementById('qrHint');
    if(!url){
      box.innerHTML = '';
      hint.textContent = 'Paste the published page link above to generate its QR code.';
      return;
    }
    try{
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      box.innerHTML = qr.createImgTag(6, 8);
      hint.textContent = 'QR code for this page — print or project it for students to scan';
    }catch(e){
      box.innerHTML = '';
      hint.textContent = 'That link is too long or not valid to encode as a QR code.';
    }
  }
  function buildQr(){
    var input = document.getElementById('qrUrlInput');
    var currentUrl = window.location.href;
    if(looksLikeRealPublicUrl(currentUrl) && !input.value){
      input.value = currentUrl;
      generateQr(currentUrl);
    } else if(input.value){
      generateQr(input.value.trim());
    } else {
      generateQr(null);
    }
  }
  document.getElementById('qrGenBtn').addEventListener('click', function(){
    generateQr(document.getElementById('qrUrlInput').value.trim());
  });
</script>
